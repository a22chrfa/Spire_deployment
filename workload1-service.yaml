# This opens a service for our workload1. It is the one that will be contacted by workload2 via mTLS.
# More specifically, this is defined in workload2.py where we call on "workload1:8443"
apiVersion: v1
kind: Service
metadata:
  name: workload1
  namespace: default
spec:
  selector:
    app: workload1
  ports:
    - port: 8443
      targetPort: 8443